<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf8ff">
  <meta name="description" content="CinopLusの利用環境を選択してください。">
  <title>CinopLus Home</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #243746;
      --muted: #718795;
      --blue: #4daed0;
      --blue-dark: #278cac;
      --sky: #eaf8ff;
      --line: #dceef5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f8fdff 0%, var(--sky) 100%);
    }
    main { width: min(100%, 760px); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: var(--blue);
      box-shadow: 0 5px 14px #4daed044;
    }
    .card {
      padding: clamp(25px, 6vw, 54px);
      border: 1px solid #ffffff;
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 20px 60px #367a9517;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 40px); line-height: 1.3; }
    .lead { margin: 12px 0 30px; color: var(--muted); line-height: 1.8; }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .option {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .option:hover, .option:focus-visible {
      transform: translateY(-3px);
      border-color: #91d2e7;
      box-shadow: 0 10px 24px #367a9514;
      outline: none;
    }
    .option:focus-visible { outline: 3px solid #4daed066; outline-offset: 3px; }
    .option-title { font-size: 19px; font-weight: 700; }
    .option-detail { margin-top: 7px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .arrow { align-self: flex-end; color: var(--blue-dark); font-size: 21px; }
    footer { margin-top: 22px; color: #91a3ad; font-size: 12px; text-align: center; }
    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      .brand { margin: 0 0 20px 4px; }
      .card { border-radius: 20px; }
      .options { grid-template-columns: 1fr; }
      .option { min-height: 120px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark" aria-hidden="true">C</span>CinopLus</div>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">WELCOME</p>
      <h1 id="page-title">どの環境で利用しますか？</h1>
      <p class="lead">お使いの環境に合わせて、表示するページを選んでください。</p>
      <nav class="options" aria-label="表示するページを選択">
        <a class="option" href="./pc/">
          <span><span class="option-title">パソコン</span><span class="option-detail">パソコン向けのページを開きます。</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="option" href="./apf/">
          <span><span class="option-title">オールプラットフォーム</span><span class="option-detail">すべてのプラットフォーム向けページを開きます。</span></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </section>
    <footer>CinopLus</footer>
  </main>
</body>
</html>
