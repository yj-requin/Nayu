<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lame Client - Official Wiki & Guide</title>
  <style>
    :root {
      --accent-color: #b356d9;
      --accent-light: #d17bff;
      --accent-glow: rgba(179, 86, 217, 0.4);
      --accent-bg: rgba(179, 86, 217, 0.15);
      --accent-bg-hover: rgba(179, 86, 217, 0.3);
      --accent-gradient: linear-gradient(90deg, rgba(179, 86, 217, 0.5) 0%, rgba(179, 86, 217, 0.1) 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(138, 43, 226, 0.15), transparent 70%),
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231a2810"/><path d="M0 0h50v50H0z" fill="%23243816"/><path d="M50 50h50v50H50z" fill="%231f3213"/></svg>');
      background-size: cover, cover, 64px 64px;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Client GUI Main Container */
    .client-container {
      width: 1000px;
      max-width: 100%;
      height: 600px;
      display: flex;
      border: 3px solid var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 15px rgba(0, 0, 0, 0.8);
      position: relative;
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: blur(4px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    /* Top Utility Bar */
    .top-bar {
      position: absolute;
      top: 10px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
      font-size: 15px;
      font-weight: 500;
      color: #ccc;
      text-shadow: 1px 1px 2px #000;
    }

    .top-bar .btn {
      cursor: pointer;
      transition: color 0.2s;
    }

    .top-bar .btn:hover {
      color: var(--accent-light);
    }

    .top-bar .logo-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 10px;
      transition: color 0.3s;
    }

    .top-bar .logo-title span {
      background: var(--accent-color);
      color: #000;
      padding: 0 4px;
      font-size: 16px;
      border-radius: 2px;
      transition: background 0.3s;
    }

    /* Left Sidebar Tabs */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      border-right: 2px solid var(--accent-color);
      display: flex;
      flex-direction: column;
      background: rgba(10, 10, 12, 0.7);
      padding-top: 15px;
      overflow-y: auto;
      transition: border-color 0.3s;
    }

    .tab-btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #d0d0d0;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      position: relative;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 2px #000;
    }

    .tab-btn:hover {
      color: #fff;
      background: var(--accent-bg);
    }

    .tab-btn.active {
      color: #fff;
      background: var(--accent-gradient);
    }

    .tab-btn.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-light);
      box-shadow: 0 0 8px var(--accent-light);
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      padding: 25px 30px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .tab-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 5px;
      width: max-content;
      min-width: 150px;
      transition: border-color 0.3s;
    }

    .tab-header h2 {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    .page-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #aaa;
    }

    .page-btn {
      background: #333;
      color: #fff;
      border: 1px solid #666;
      padding: 2px 10px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 3px;
    }

    .page-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-light);
    }

    /* Grid Layout for Modules */
    .module-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .module-card {
      background: rgba(45, 45, 50, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 15px;
      font-weight: 500;
      color: #e0e0e0;
      text-shadow: 1px 1px 2px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      border-radius: 3px;
    }

    .module-card:hover {
      background: var(--accent-bg-hover);
      border-color: var(--accent-color);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px var(--accent-glow);
    }

    /* Settings View Styling */
    .sub-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .sub-tab-btn {
      font-size: 18px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      padding-bottom: 2px;
      text-shadow: 1px 1px 2px #000;
    }

    .sub-tab-btn:hover {
      color: #fff;
    }

    .sub-tab-btn.active {
      color: #fff;
      background: var(--accent-bg-hover);
      padding: 2px 12px;
      border-bottom: 3px solid var(--accent-light);
      border-radius: 2px;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 650px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      color: #ddd;
      padding: 6px 0;
      text-shadow: 1px 1px 2px #000;
    }

    .setting-label-clickable {
      cursor: pointer;
      transition: color 0.2s;
    }

    .setting-label-clickable:hover {
      color: var(--accent-light);
      text-decoration: underline;
    }

    .toggle-switch {
      width: 45px;
      height: 22px;
      background: #444;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      border: 1px solid #666;
    }

    .toggle-switch.on {
      background: var(--accent-color);
      border-color: var(--accent-light);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.2s;
    }

    .toggle-switch.on::after {
      left: 25px;
    }

    /* Accent Color Palette */
    .color-palette {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .color-box {
      width: 24px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
      transition: transform 0.1s;
    }

    .color-box:hover {
      transform: scale(1.15);
    }

    /* Config SubTab Layout */
    .config-container {
      display: flex;
      gap: 40px;
      margin-top: 10px;
    }

    .config-section {
      flex: 1;
    }

    .config-section-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 12px;
      text-shadow: 1px 1px 2px #000;
    }

    .config-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: rgba(45, 45, 50, 0.8);
      border: 1px solid var(--accent-color);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 3px;
    }

    .config-btn:hover {
      background: var(--accent-bg-hover);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .config-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .config-item {
      padding: 10px 15px;
      background: rgba(35, 35, 40, 0.7);
      font-size: 15px;
      color: #ccc;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 3px;
    }

    .config-item:hover {
      background: var(--accent-bg);
    }

    .config-item.active {
      background: var(--accent-bg-hover);
      color: #fff;
      border-color: var(--accent-light);
    }

    /* About Content Layout */
    .about-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .about-top-container {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .about-image-box {
      width: 320px;
      max-width: 45%;
      height: 200px;
      background: rgba(20, 20, 25, 0.8);
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .about-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-image-fallback {
      font-size: 32px;
      font-weight: bold;
      color: var(--accent-light);
      text-align: center;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .about-credits-box {
      flex: 1;
    }

    .credits-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-light);
      margin-bottom: 15px;
      text-shadow: 1px 1px 2px #000;
    }

    .credits-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .credit-name {
      font-size: 16px;
      font-weight: bold;
      color: #eee;
      letter-spacing: 0.5px;
      cursor: pointer;
      padding: 6px 12px;
      background: rgba(45, 45, 50, 0.5);
      border-radius: 4px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .credit-name:hover {
      background: var(--accent-bg-hover);
      border-color: var(--accent-color);
      color: #fff;
      transform: translateX(4px);
    }

    .about-bottom-info {
      display: flex;
      gap: 80px;
      margin-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 15px;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      font-size: 14px;
      color: #aaa;
    }

    .info-val {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }

    /* Modal / Popup Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      backdrop-filter: blur(2px);
      padding: 20px;
      cursor: pointer;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 480px;
      max-width: 100%;
      background: #1e1e24;
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
      padding: 25px;
      position: relative;
      border-radius: 4px;
      cursor: default;
    }

    .modal-title {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent-light);
      margin-bottom: 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }

    .modal-category {
      font-size: 13px;
      font-weight: bold;
      color: #888;
      margin-bottom: 15px;
    }

    .modal-desc {
      font-size: 15px;
      line-height: 1.6;
      color: #ddd;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    .modal-close {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      float: right;
      transition: background 0.2s;
      border-radius: 3px;
    }

    .modal-close:hover {
      background: var(--accent-light);
    }

    /* Empty tab message */
    .empty-msg {
      color: #666;
      font-size: 18px;
      margin-top: 40px;
      text-align: center;
    }

    /* Responsive Styles for Mobile / Tablet */
    @media (max-width: 768px) {
      body {
        padding: 10px;
        align-items: flex-start;
      }

      .client-container {
        flex-direction: column;
        height: auto;
        min-height: 90vh;
      }

      .top-bar {
        position: relative;
        top: 0;
        right: 0;
        padding: 12px 15px;
        background: rgba(0, 0, 0, 0.5);
        justify-content: space-between;
        width: 100%;
        border-bottom: 1px solid var(--accent-color);
        font-size: 13px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        border-right: none;
        border-bottom: 2px solid var(--accent-color);
        padding-top: 0;
        overflow-x: auto;
        white-space: nowrap;
      }

      .tab-btn {
        padding: 10px 15px;
        font-size: 14px;
        display: inline-block;
      }

      .tab-btn.active::before {
        width: 100%;
        height: 3px;
        top: auto;
        bottom: 0;
        left: 0;
      }

      .content-area {
        padding: 15px;
      }

      .module-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .module-card {
        font-size: 13px;
        padding: 10px 5px;
      }

      .config-container, .about-top-container {
        flex-direction: column;
        gap: 20px;
      }

      .about-image-box {
        width: 100%;
        max-width: 100%;
      }
    }

    @media (max-width: 480px) {
      .module-grid {
        grid-template-columns: repeat(1, 1fr);
      }

      .top-bar .btn {
        display: none;
      }
    }
  </style>
</head>

    let currentTab = 'Combat';
    let currentRenderPage = 1;
    let currentSettingsSubTab = 'General';

    function switchTab(tabName) {
      currentTab = tabName;
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === tabName);
      });

      renderContent();
    }

    function renderContent() {
      const headerContainer = document.getElementById('tab-header-container');
      const mainView = document.getElementById('main-view');

      headerContainer.innerHTML = '';
      mainView.innerHTML = '';

      if (currentTab === 'Settings') {
        renderSettings();
        return;
      }

      if (currentTab === 'PlayerList' || currentTab === 'Chat') {
        headerContainer.innerHTML = `<div class="tab-header"><h2>${currentTab}</h2></div>`;
        mainView.innerHTML = `<div class="empty-msg">このタブには表示項目がありません。</div>`;
        return;
      }

      let modules = [];
      let headerHTML = `<div class="tab-header"><h2>${currentTab}</h2>`;

      if (currentTab === 'Render') {
        headerHTML += `
          <div class="page-controls">
            <span>Page ${currentRenderPage}/2</span>
            <button class="page-btn" onclick="changeRenderPage(1)">&lt;</button>
            <button class="page-btn" onclick="changeRenderPage(2)">&gt;</button>
          </div>
        `;
        modules = currentRenderPage === 1 ? moduleData.Render1 : moduleData.Render2;
      } else {
        modules = moduleData[currentTab] || [];
      }

      headerHTML += `</div>`;
      headerContainer.innerHTML = headerHTML;

      let gridHTML = `<div class="module-grid">`;
      modules.forEach(mod => {
        gridHTML += `<div class="module-card" onclick="openModal('${mod}', '${currentTab}')">${mod}</div>`;
      });
      gridHTML += `</div>`;

      mainView.innerHTML = gridHTML;
    }

    function changeRenderPage(page) {
      currentRenderPage = page;
      renderContent();
    }

    // Color Theme Switcher
    function setAccentColor(hexColor) {
      const root = document.documentElement;
      let lightColor = hexColor;
      
      // Calculate a slightly lighter version for glow/hover
      if (hexColor === '#b356d9') lightColor = '#d17bff';
      else if (hexColor === '#00e5ff') lightColor = '#80f3ff';
      else if (hexColor === '#ff0000') lightColor = '#ff6666';
      else if (hexColor === '#ffcc00') lightColor = '#ffea80';
      else if (hexColor === '#ccff00') lightColor = '#e6ff80';
      else if (hexColor === '#00ff00') lightColor = '#80ff80';
      else if (hexColor === '#0022ff') lightColor = '#667aff';
      else if (hexColor === '#a822ff') lightColor = '#c973ff';
      else if (hexColor === '#ffb3d9') lightColor = '#ffffff';
      else if (hexColor === '#ffffff') lightColor = '#e6e6e6';

      root.style.setProperty('--accent-color', hexColor);
      root.style.setProperty('--accent-light', lightColor);
      root.style.setProperty('--accent-glow', `${hexColor}66`);
      root.style.setProperty('--accent-bg', `${hexColor}26`);
      root.style.setProperty('--accent-bg-hover', `${hexColor}4D`);
      root.style.setProperty('--accent-gradient', `linear-gradient(90deg, ${hexColor}80 0%, ${hexColor}1A 100%)`);
    }

    // Modal Operations
    function openModal(name, category) {
      document.getElementById('modal-title').innerText = name;
      document.getElementById('modal-category').innerText = `CATEGORY: ${category.toUpperCase()}`;
      
      const desc = descriptions[name] && descriptions[name].trim() !== "" 
        ? descriptions[name] 
        : `${name} の説明文は未設定です。`;
      
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-overlay').classList.add('active');
    }

    function openSettingModal(name) {
      document.getElementById('modal-title').innerText = name;
      document.getElementById('modal-category').innerText = `SETTINGS / OPTION`;
      
      const desc = settingDescriptions[name] || `${name} の詳細説明です。`;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-overlay').classList.add('active');
    }

    function openDevModal(devName) {
      const dev = developerData[devName] || { role: "Developer", desc: "詳細情報は設定されていません。" };
      document.getElementById('modal-title').innerText = devName;
      document.getElementById('modal-category').innerText = `DEVELOPER / ${dev.role.toUpperCase()}`;
      document.getElementById('modal-desc').innerText = dev.desc;
      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    // Initialize View
    renderContent();
  </script>
</body>
</html>
