<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ee">
<title>ファイルダウンロード</title>
<style>
:root{color-scheme:light;--ink:#202820;--muted:#687268;--line:#e4e7df;--green:#28634b;--pale:#edf4ee;--paper:#fff;--bg:#f5f6f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.65}
.wrap{width:min(1080px,calc(100% - 40px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line);background:#fff}.brand{font-weight:750;letter-spacing:.02em}.hero{padding:64px 0 38px}.eyebrow{color:var(--green);font-size:.8rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.2;margin:12px 0}.hero p{color:var(--muted);max-width:650px;margin:12px 0 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:28px 0 14px}.section-head h2{font-size:1.2rem;margin:0}.count{color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding-bottom:56px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 5px 18px #243a2410}.preview{height:165px;background:linear-gradient(135deg,#edf4ee,#e8eee6);display:grid;place-items:center;color:var(--green);font-size:2.5rem;overflow:hidden}.preview img{height:100%;width:100%;object-fit:cover}.info{padding:16px;display:flex;flex:1;flex-direction:column}.info h3{font-size:1rem;margin:0 0 4px;overflow-wrap:anywhere}.meta{font-size:.82rem;color:var(--muted);margin-bottom:12px}.desc{font-size:.9rem;color:#4d584e;margin:0 0 16px;flex:1}.button{display:inline-flex;justify-content:center;align-items:center;min-height:42px;padding:9px 14px;border-radius:9px;background:var(--green);color:white;text-decoration:none;font-size:.9rem;font-weight:700}.button:hover{background:#1e503b}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd4c9;border-radius:16px;padding:32px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header class="top"><div class="wrap brand">ファイルライブラリ</div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">Download Library</div><h1>ファイルをダウンロード</h1><p>必要なファイルを選んでダウンロードしてください。画像はカード上でプレビューできます。</p></section>
<section aria-labelledby="files-title"><div class="section-head"><h2 id="files-title">配布ファイル</h2><span class="count" id="count"></span></div><div class="grid" id="file-list"></div></section>
</main>
<footer><div class="wrap">ダウンロードに問題がある場合は、サイトの管理者にお問い合わせください。</div></footer>
<script>
// 配布するファイルを downloads フォルダーに置き、下の一覧に1件ずつ追加してください。
// 画像をプレビューする場合は preview に画像の相対パスを指定します。
const files = [
  // { name: "製品カタログ.pdf", path: "downloads/製品カタログ.pdf", description: "製品情報と仕様", preview: "" },
  // { name: "サンプル画像.jpg", path: "downloads/サンプル画像.jpg", description: "", preview: "downloads/サンプル画像.jpg" },
  { name: "VScode_CMDBuild", path: "downloads/VScode.zip", description: "VSCodeでビルドを簡単にするファイルです。", preview: "Icon/VScode" },
  { name: "YouTuView", path: "downloads/YouTuView.zip", description: "YouTubeの動画の再生回数を稼ぐツールです。", preview: "Icon/YouTuView" },
];
const list = document.querySelector("#file-list");
document.querySelector("#count").textContent = `${files.length} 件`;
if (files.length === 0) {
  list.innerHTML = '<div class="empty"><strong>ファイルを準備中です</strong>管理者がファイルを追加すると、ここに表示されます。</div>';
} else {
  for (const file of files) {
    const card = document.createElement("article"); card.className = "card";
    const preview = document.createElement("div"); preview.className = "preview";
    if (file.preview) { const img = document.createElement("img"); img.src = file.preview; img.alt = file.name; preview.append(img); }
    else preview.textContent = "⇩";
    const info = document.createElement("div"); info.className = "info";
    const title = document.createElement("h3"); title.textContent = file.name;
    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = file.type || "ダウンロードファイル";
    const desc = document.createElement("p"); desc.className = "desc"; desc.textContent = file.description || "";
    const link = document.createElement("a"); link.className = "button"; link.href = file.path; link.download = ""; link.textContent = "ダウンロード";
    info.append(title, meta, desc, link); card.append(preview, info); list.append(card);
  }
}
</script>
</body>
</html>
