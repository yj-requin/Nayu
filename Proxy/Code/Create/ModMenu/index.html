<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MODMENU作成ツール</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121b2d;--panel2:#18243a;--line:#2a3954;--text:#edf3ff;--muted:#9cacbf;--accent:#63d4c2;--blue:#81b9ff;--danger:#ff8d9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0,#173047 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",Meiryo,sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:30px 22px 56px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:clamp(25px,4vw,36px);margin:0;letter-spacing:.02em}header p{color:var(--muted);margin:5px 0 0}.badge{border:1px solid #397669;color:#a9f2e5;padding:7px 12px;border-radius:999px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(300px,.86fr) minmax(0,1.14fr);gap:18px}.panel{background:linear-gradient(160deg,rgba(25,38,60,.96),rgba(16,25,42,.98));border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 15px 40px #0003}.panel h2{font-size:17px;margin:0 0 15px}.category-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.category{display:flex;gap:9px;align-items:center;min-height:46px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#0e1728;cursor:pointer}.category:has(input:checked){border-color:var(--accent);background:#12302f}.category input{accent-color:var(--accent);width:16px;height:16px}.hint{font-size:12px;color:var(--muted);margin:11px 0 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:18px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0a1220;color:var(--text);font:inherit}.field:first-child{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:10px 14px;font:600 14px inherit;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.18);transform:translateY(-1px)}button.primary{background:var(--accent);color:#06201d;border-color:var(--accent)}button.subtle{background:transparent}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:460px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #26344b}th{font-size:12px;color:var(--muted);background:#0c1524}tbody tr:last-child td{border-bottom:0}td input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}.remove{padding:5px 8px;color:#ffb4bc}.empty{text-align:center;color:var(--muted);padding:25px 12px}.output-panel{margin-top:18px}.output-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.output-head h2{margin:0}.status{min-height:1.5em;color:var(--muted);font-size:12px}textarea{width:100%;height:330px;resize:vertical;padding:16px;border:1px solid var(--line);border-radius:10px;background:#080e19;color:#c9e8ff;font:13px/1.7 Consolas,"Cascadia Code",monospace;tab-size:4}footer{margin-top:14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}a{color:var(--blue)}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 40px}header{align-items:flex-start}.badge{display:none}}@media(max-width:430px){.category-list{grid-template-columns:1fr}.panel{padding:16px}}
:root[data-theme="light"]{color-scheme:light;--bg:#eef3f8;--panel:#fff;--panel2:#e8eef6;--line:#cbd5e1;--text:#172338;--muted:#5f6f84;--accent:#087f72;--blue:#075db5;--danger:#bd3347} :root[data-theme="light"] body{background:radial-gradient(ellipse at 12% 0,#d9eaf0 0,transparent 38%),var(--bg)} :root[data-theme="light"] .panel{background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(248,250,252,.99));box-shadow:0 12px 32px #25365012} :root[data-theme="light"] .category{background:#f8fafc} :root[data-theme="light"] .category:has(input:checked){background:#e4f5f1} :root[data-theme="light"] .field input{background:#fff;color:var(--text)} :root[data-theme="light"] th{background:#f1f5f9} :root[data-theme="light"] th, :root[data-theme="light"] td{border-bottom-color:#dbe3ed} :root[data-theme="light"] textarea{background:#f8fafc;color:#173047} :root[data-theme="light"] .note{background:#e7f1f8;color:#334b61}@media(max-width:760px){header{flex-wrap:wrap}}.theme-select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}</style>
</head>
<body><div class="wrap">
<header><div><h1>MODMENU作成ツール</h1><p>アイテムを登録して、コードを生成します。</p></div><div style="display:flex;align-items:center;gap:10px"><label for="theme" class="hint" style="margin:0">テーマ</label><select id="theme" class="theme-select" aria-label="テーマ"><option value="dark">ダーク</option><option value="light">ライト</option></select><span class="badge">オフライン対応 · HTML 1ファイル</span></div></header>
<div class="grid">
<section class="panel"><h2>クリエイティブの種類</h2><div class="category-list" id="categories"></div><p class="hint">カテゴリを1つ選択してください。</p></section>
<section class="panel"><h2>アイテムの追加</h2><div class="fields">
<div class="field"><label for="itemId">アイテムID（0〜2267）</label><input id="itemId" type="number" min="0" max="2267" value="0"></div>
<div class="field"><label for="damage">ダメージ値（0〜255）</label><input id="damage" type="number" min="0" max="255" value="0"></div>
<div class="field"><label for="count">個数（1〜255）</label><input id="count" type="number" min="1" max="255" value="1"></div>
</div><div class="actions"><button id="add" class="primary">＋ アイテムを追加</button><button id="ids" class="subtle">アイテムID一覧表</button></div><p class="hint">一覧に追加した後、生成に含めるアイテムにチェックを入れてください。</p></section>
</div>
<section class="panel" style="margin-top:18px"><h2>アイテム一覧</h2><div class="table-wrap"><table><thead><tr><th>生成</th><th>ID</th><th>ダメージ値</th><th>個数</th><th>操作</th></tr></thead><tbody id="items"><tr><td colspan="5" class="empty">アイテムはまだありません</td></tr></tbody></table></div></section>
<section class="panel output-panel"><div class="output-head"><h2>生成コード</h2><span id="status" class="status" aria-live="polite"></span></div><textarea id="output" spellcheck="false" placeholder="カテゴリとアイテムを選択して「コードを生成」を押してください"></textarea><div class="actions"><button class="primary" id="generate">コードを生成</button><button id="copy">コピー</button><button id="clear">出力をリセット</button></div></section>
<footer><span>MODMENU作成ツール HTML版</span><a href="https://minecraft-ids.grahamedgecombe.com/" target="_blank" rel="noopener">Minecraft アイテムID一覧を開く ↗</a></footer>
</div>
<script>
(()=>{
const cats=[['building','建築ブロック','10a0a6c0'],['decoration','飾り','10a0a6d0'],['redstone','レッドストーンと乗り物','10a0a6f0'],['materials','材料','10a0a700'],['food','食べ物','10a0a710'],['tools','道具、武器、防具','10a0a720'],['brewing','調合','10a0a760'],['other','その他','10a0a770']];
const catBox=document.getElementById('categories'), list=document.getElementById('items'), output=document.getElementById('output'), status=document.getElementById('status');let items=[];
const theme=document.getElementById('theme');const savedTheme=localStorage.getItem('modmenu-theme')||'dark';document.documentElement.dataset.theme=savedTheme;theme.value=savedTheme;theme.addEventListener('change',()=>{document.documentElement.dataset.theme=theme.value;localStorage.setItem('modmenu-theme',theme.value)});
catBox.innerHTML=cats.map(c=>`<label class="category"><input type="radio" name="category" value="${c[0]}"><span>${c[1]}</span></label>`).join('');
function render(){if(!items.length){list.innerHTML='<tr><td colspan="5" class="empty">アイテムはまだありません</td></tr>';return}list.innerHTML=items.map((it,i)=>`<tr><td><input type="checkbox" aria-label="ID ${it.id}を生成に含める" ${it.enabled?'checked':''} data-check="${i}"></td><td>${it.id}</td><td>${it.damage}</td><td>${it.count}</td><td><button class="remove" data-remove="${i}" title="削除">削除</button></td></tr>`).join('');list.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('change',()=>items[+el.dataset.check].enabled=el.checked));list.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{items.splice(+el.dataset.remove,1);render()}))}
const hx=n=>Number(n).toString(16);
function padIndex(n){let s=hx(n);return s.padStart(4,'0')+' '}
function padLong(n){return hx(n).padStart(8,'0')}
function generate(){status.textContent='';const cat=cats.find(c=>c[0]===document.querySelector('input[name="category"]:checked')?.value);if(!cat){status.textContent='カテゴリを1つ選択してください。';return}const chosen=items.filter(x=>x.enabled);let lines=[];chosen.forEach((it,index)=>{if(index===0)lines.push('30000000 109df84c','10000000 50000000');lines.push(`1012${padIndex(index)}${padLong(it.id*4)}`)});chosen.forEach((it,index)=>{lines.push(`30000000 ${cat[2]}`,'10000000 50000000',`31000000 ${padLong(index*4)}`,'30100000 00000000','10000000 50000000',`1112${padIndex(index)}00000014`,`0012000c ${padLong(it.count)}`,`00120020 ${padLong(it.damage)}`)});lines.push('D0000000 DEADCAFE');output.value=lines.join('\n');status.textContent=`${chosen.length}件のアイテムで生成しました。`}
document.getElementById('add').addEventListener('click',()=>{const id=+document.getElementById('itemId').value,damage=+document.getElementById('damage').value,count=+document.getElementById('count').value;if(!Number.isInteger(id)||id<0||id>2267){status.textContent='アイテムIDは0〜2267で入力してください。';return}if(!Number.isInteger(damage)||damage<0||damage>255){status.textContent='ダメージ値は0〜255で入力してください。';return}if(!Number.isInteger(count)||count<1||count>255){status.textContent='個数は1〜255で入力してください。';return}items.push({id,damage,count,enabled:false});render();status.textContent=`ID ${id} を一覧に追加しました。`});
document.getElementById('generate').addEventListener('click',generate);document.getElementById('clear').addEventListener('click',()=>{output.value='';status.textContent='出力をリセットしました。'});document.getElementById('copy').addEventListener('click',async()=>{if(!output.value){status.textContent='コピーするコードがありません。';return}try{await navigator.clipboard.writeText(output.value);status.textContent='コードをコピーしました。'}catch{output.focus();output.select();status.textContent='コードを選択しました。Ctrl+Cでコピーしてください。'}});document.getElementById('ids').addEventListener('click',()=>window.open('https://minecraft-ids.grahamedgecombe.com/','_blank','noopener'));
})();
</script></body></html>
